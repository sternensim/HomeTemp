# ESPHome Configuration — Solar Energy Display
# Hardware: TENSTAR ESP32-2432S028R ("Cheap Yellow Display" / CYD)
# Display: ILI9342 320×240 landscape, LVGL UI
#
# Layout:
#  ┌────────────── HEADER (320×36) ───────────────┐
#  │       HOME ENERGY MONITOR          HH:MM     │
#  ├──────────────────────┬───────────────────────┤
#  │  BATTERY             │  SOLAR NOW            │
#  │     87%              │     2.4 kW            │
#  │  [========  ]        │                       │
#  ├──────────────────────┼───────────────────────┤
#  │  HOUSE DRAW          │  SOLAR +1H            │
#  │     1.1 kW           │     1.8 kW            │
#  └──────────────────────┴───────────────────────┘

esphome:
  name: cyd-energy-display
  friendly_name: Energy Display

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid_intern
  password: !secret wifi_password_intern
  ap:
    ssid: "Energy-Display-AP"
    password: !secret ap_password

captive_portal:

# ─── Time ─────────────────────────────────────────────────────────────────────
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /1
        then:
          - lambda: |-
              auto now = id(homeassistant_time).now();
              if (!now.is_valid()) return;
              static char buf[6];
              now.strftime(buf, sizeof(buf), "%H:%M");
              lv_label_set_text(id(lbl_time), buf);

# ─── Sensors ──────────────────────────────────────────────────────────────────
sensor:
  - platform: homeassistant
    id: s_battery
    entity_id: sensor.hostname_scb_5aa77b_battery_soc
    internal: true
    on_value:
      - lambda: |-
          int pct = (int)x;
          pct = pct < 0 ? 0 : (pct > 100 ? 100 : pct);
          char buf[8];
          snprintf(buf, sizeof(buf), "%d%%", pct);
          lv_label_set_text(id(lbl_battery_val), buf);
          lv_color_t c = pct < 20 ? lv_color_hex(0xff4444)
                       : pct < 40 ? lv_color_hex(0xf0c030)
                                  : lv_color_hex(0x00cc55);
          lv_obj_set_style_text_color(id(lbl_battery_val), c, 0);
          lv_obj_set_style_bg_color(id(bar_battery), c, LV_PART_INDICATOR);
          lv_bar_set_value(id(bar_battery), pct, LV_ANIM_OFF);

  - platform: homeassistant
    id: s_solar
    entity_id: sensor.hostname_scb_5aa77b_solar_power
    internal: true
    on_value:
      - lambda: |-
          char buf[10];
          if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f", x / 1000.0f);
          else              snprintf(buf, sizeof(buf), "%d",   (int)x);
          lv_label_set_text(id(lbl_solar_val),  buf);
          lv_label_set_text(id(lbl_solar_unit), x >= 1000.0f ? "kW" : "W");

  - platform: homeassistant
    id: s_house
    entity_id: sensor.hostname_scb_5aa77b_home_power
    internal: true
    on_value:
      - lambda: |-
          char buf[10];
          if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f", x / 1000.0f);
          else              snprintf(buf, sizeof(buf), "%d",   (int)x);
          lv_label_set_text(id(lbl_house_val),  buf);
          lv_label_set_text(id(lbl_house_unit), x >= 1000.0f ? "kW" : "W");

  - platform: homeassistant
    id: s_forecast
    entity_id: sensor.home_energy_next_hour
    internal: true
    on_value:
      - lambda: |-
          char buf[10];
          if (x >= 1000.0f) snprintf(buf, sizeof(buf), "%.1f", x / 1000.0f);
          else              snprintf(buf, sizeof(buf), "%d",   (int)x);
          lv_label_set_text(id(lbl_forecast_val),  buf);
          lv_label_set_text(id(lbl_forecast_unit), x >= 1000.0f ? "kW" : "W");

# ─── SPI Bus ──────────────────────────────────────────────────────────────────
spi:
  - id: display_spi
    clk_pin:  GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# ─── Backlight ────────────────────────────────────────────────────────────────
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

# ─── Display ──────────────────────────────────────────────────────────────────
display:
  - platform: ili9xxx
    model: ILI9342
    id: my_display
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    rotation: 0
    dimensions:
      width: 320
      height: 240
    update_interval: never   # LVGL owns all redraws

# ─── LVGL UI ──────────────────────────────────────────────────────────────────
lvgl:
  displays:
    - my_display
  default_font: montserrat_14

  pages:
    - id: page_main
      bg_color: 0x121225
      pad_all: 0

      widgets:

        # ── Header ────────────────────────────────────────────────────────────
        - obj:
            x: 0
            y: 0
            width: 320
            height: 36
            bg_color: 0x1e2a4a
            border_width: 0
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: center
                  text: "HOME ENERGY MONITOR"
                  text_font: montserrat_20
                  text_color: 0xffffff
              - label:
                  id: lbl_time
                  align: right_mid
                  x: -4
                  text: "--:--"
                  text_font: montserrat_14
                  text_color: 0x778899

        # ── BATTERY (top-left) ────────────────────────────────────────────────
        - obj:
            x: 4
            y: 40
            width: 152
            height: 95
            bg_color: 0x1a2744
            border_color: 0x2a3f6f
            border_width: 1
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: top_mid
                  y: 5
                  text: "BATTERY"
                  text_font: montserrat_14
                  text_color: 0x778899
              - label:
                  id: lbl_battery_val
                  align: top_mid
                  y: 22
                  text: "---"
                  text_font: montserrat_38
                  text_color: 0x00cc55
              - bar:
                  id: bar_battery
                  x: 10
                  y: 79
                  width: 132
                  height: 8
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x2a3f6f
                  indicator:
                    bg_color: 0x00cc55

        # ── SOLAR NOW (top-right) ─────────────────────────────────────────────
        - obj:
            x: 164
            y: 40
            width: 152
            height: 95
            bg_color: 0x1a2744
            border_color: 0x2a3f6f
            border_width: 1
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: top_mid
                  y: 5
                  text: "SOLAR NOW"
                  text_font: montserrat_14
                  text_color: 0x778899
              - label:
                  id: lbl_solar_val
                  align: top_mid
                  y: 22
                  text: "---"
                  text_font: montserrat_38
                  text_color: 0xf0c030
              - label:
                  id: lbl_solar_unit
                  align: top_mid
                  y: 74
                  text: ""
                  text_font: montserrat_14
                  text_color: 0xf0c030

        # ── HOUSE DRAW (bottom-left) ──────────────────────────────────────────
        - obj:
            x: 4
            y: 140
            width: 152
            height: 95
            bg_color: 0x1a2744
            border_color: 0x2a3f6f
            border_width: 1
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: top_mid
                  y: 5
                  text: "HOUSE DRAW"
                  text_font: montserrat_14
                  text_color: 0x778899
              - label:
                  id: lbl_house_val
                  align: top_mid
                  y: 22
                  text: "---"
                  text_font: montserrat_38
                  text_color: 0x4499ff
              - label:
                  id: lbl_house_unit
                  align: top_mid
                  y: 74
                  text: ""
                  text_font: montserrat_14
                  text_color: 0x4499ff

        # ── SOLAR +1H (bottom-right) ──────────────────────────────────────────
        - obj:
            x: 164
            y: 140
            width: 152
            height: 95
            bg_color: 0x1a2744
            border_color: 0x2a3f6f
            border_width: 1
            radius: 0
            pad_all: 0
            widgets:
              - label:
                  align: top_mid
                  y: 5
                  text: "SOLAR +1H"
                  text_font: montserrat_14
                  text_color: 0x778899
              - label:
                  id: lbl_forecast_val
                  align: top_mid
                  y: 22
                  text: "---"
                  text_font: montserrat_38
                  text_color: 0xff9922
              - label:
                  id: lbl_forecast_unit
                  align: top_mid
                  y: 74
                  text: ""
                  text_font: montserrat_14
                  text_color: 0xff9922
